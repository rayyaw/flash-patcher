name: Common Setup
description: Set up Python, Java, and shared dependencies

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: pyproject.toml

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: adopt
        java-version: '17'

    - name: Install FFDec (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "Installing FFDec..."
        wget https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version20.1.0/ffdec_20.1.0.deb
        sudo apt-get update
        sudo apt-get install -y ./ffdec_20.1.0.deb

    - name: Install FFDec (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Output "Installing FFDec..."
        winget install `
          --id JPEXS.FFDec `
          --exact `
          --version 20.1.0 `
          --silent `
          --accept-package-agreements `
          --accept-source-agreements `
          --disable-interactivity

    - name: Install Python dependencies
      shell: bash
      run: |
        echo "Installing pip dependencies..."
        python -m pip install hatch
        hatch env create test
