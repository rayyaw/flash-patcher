name: Common Setup
description: Set up Python, Java, and shared dependencies

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: build/pyproject.toml

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: adopt
        java-version: '17'

    - name: Install FFDec
      shell: bash
      run: |
        echo "Installing FFDec..."
        wget https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version20.1.0/ffdec_20.1.0.deb
        sudo apt-get update
        sudo apt-get install -y ./ffdec_20.1.0.deb

    - name: Install ANTLR
      shell: bash
      run: |
        echo "Installing ANTLR..."
        sudo apt-get install -y antlr4

    - name: Install Python dependencies
      shell: bash
      run: |
        echo "Installing pip dependencies..."
        python -m pip install hatch
        hatch env create test
