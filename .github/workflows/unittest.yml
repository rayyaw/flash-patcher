name: Unit Tests

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/common-setup
    - name: Run unit tests and verify coverage
      env:
        ANTLR_TARGET: antlr-java
      run: |
        cd build && make test
