name: Unit Tests

on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/common-setup
    - name: Run unit tests and verify coverage
      run: hatch run test:unit
