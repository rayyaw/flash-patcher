name: Pylint

on: [pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/common-setup
    - name: Pylint style analysis
      run: hatch run test:lint
