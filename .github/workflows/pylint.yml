name: Pylint

on: [pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/common-setup
    - name: Pylint style analysis
      run: |
        hatch build
        hatch run test:lint
