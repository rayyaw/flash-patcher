name: Pylint

on: [pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/common-setup
    - name: Pylint style analysis
      env:
        ANTLR_TARGET: antlr-java
      run: |
        cd build
        make pylint
