name: Integration Tests

on: [pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/common-setup
    - name: Run integration tests
      run: |
        hatch build
        hatch run integration:test
